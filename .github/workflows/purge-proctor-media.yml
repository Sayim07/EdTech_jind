name: Delete expired exam photos

# Runs every day. Calls the app, which deletes ID photos and camera photos older than each exam's retention period.
# Needs two repository secrets: APP_URL (for example https://cimindia.singhveeta.workers.dev) and CRON_SECRET
# (the same random value set as CRON_SECRET in the Cloudflare worker settings).
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call the purge endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/proctor/purge"
